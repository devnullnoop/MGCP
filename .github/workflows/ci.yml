name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A vulnerability is published on a date that has nothing to do with our
  # commits. Without a clock, a quiet week means an unchecked week, not a clean
  # one. 06:00 UTC daily.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # 3.13 is supported everywhere PyTorch still ships wheels. An
        # Intel Mac caps at 3.12, which the runtime guard reports, and CI
        # runs on Linux so it cannot reach that case.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter
        run: |
          ruff check src/

      - name: Run tests
        run: |
          pytest -v --tb=short -m "not slow"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff check src/ tests/

  # The complexity ratchet, run against the real base commit of a pull request.
  # The hook enforces it locally, and a local bypass leaves no trace in the pull
  # request, so the same module runs here as the second caller.
  complexity:
    # Only a pull request carries a base commit. On a push to main there is
    # nothing to ratchet against, and a guessed base diffs a commit with itself.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          # The default clone has depth 1. `git show <base>:<path>` then finds
          # no base blob, the script exits 2, and the step reports nothing while
          # looking like it ran.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # quality_metrics.py is stdlib only, because the hook that imports it
      # cannot reach site-packages. So this job installs nothing.
      - name: Verify the base commit is in the clone
        # Kept out of the ratchet step on purpose. That step is advisory, so its
        # exit code is swallowed, and an unresolvable base would read the same
        # as a clean run. This check is not advisory: a gate that cannot find
        # its base enforces nothing, which is worse than having no gate.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git rev-parse --verify "$BASE_SHA^{commit}"

      - name: Complexity ratchet against the pull request base
        # Advisory for the audit period in update_plan.md. The plan promotes a
        # rule on evidence, so remove continue-on-error once a sample of 10
        # would_deny events holds refusals a reviewer agrees with.
        continue-on-error: true
        env:
          # The event's base commit, never a branch name. A branch name can
          # resolve to the same commit as HEAD, which diffs a commit against
          # itself and passes every time. Read through env rather than
          # interpolated into the shell line, so a ref name cannot inject.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # These two lists mirror the commit-complexity-ratchet rule in
          # enforcement.py. If they drift, a commit passes the hook and fails
          # the pull request for a reason nobody can reproduce locally.
          python src/mgcp/hook_templates/quality_metrics.py \
            --base "$BASE_SHA" \
            --exclude 'tests/**' 'docs/**' '*.md' '**/bootstrap_data/**' \
            --file-length-exempt 'src/mgcp/server.py' \
              'src/mgcp/init_project.py' 'src/mgcp/web_server.py' \
              'src/mgcp/persistence.py' 'src/mgcp/rem_cycle.py' \
              'src/mgcp/hook_templates/pre-tool-dispatcher.py'

  audit:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # Resolve what a NEW user installs today, which is the set that matters.
      # Auditing a developer's existing environment answers a different and less
      # useful question: on 2026-10-05 a stale working venv carried 82 advisories
      # across 20 packages while a fresh resolve of the same pyproject.toml had
      # none. The lower bounds were already high enough; only the local
      # environment had drifted.
      - name: Resolve a fresh install
        run: |
          python -m pip install --dry-run --quiet --report resolve.json -e .
          python - <<'PY'
          import json
          report = json.load(open("resolve.json"))
          lines = []
          for item in report.get("install", []):
              meta = item.get("metadata", {})
              name, version = meta.get("name"), meta.get("version")
              if name and version and name.lower() != "mgcp":
                  lines.append(f"{name}=={version}")
          assert lines, "resolved nothing, which is a broken check and not a pass"
          open("resolved.txt", "w").write("\n".join(sorted(lines)) + "\n")
          print(f"resolved {len(lines)} packages")
          PY

      - name: Audit
        run: pip-audit -r resolved.txt --no-deps --progress-spinner off

      - name: Audit again, as JSON, for the log
        if: always()
        run: pip-audit -r resolved.txt --no-deps --progress-spinner off --format json || true

  sbom:
    name: software bill of materials
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the staleness test reads git history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest cyclonedx-bom

      # The committed SBOM must still describe this project. These checks hold at
      # all times, unlike byte equality with a fresh resolve, which breaks every
      # time an upstream project publishes and would teach people to ignore it.
      - name: Check the committed SBOM
        run: python -m pytest tests/test_sbom.py -q

      # A fresh bill of materials for THIS run, always accurate for the versions
      # it was built against. Downloadable from the run page for 90 days.
      - name: Generate a current SBOM
        run: |
          cyclonedx-py environment "$(python -c 'import sys; print(sys.prefix)')" \
            --of JSON --output-reproducible --pyproject pyproject.toml \
            --mc-type application -o sbom-current.cdx.json
          python -c "import json; d=json.load(open('sbom-current.cdx.json')); print(f\"{len(d['components'])} components\")"

      - name: Upload it
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-current.cdx.json
