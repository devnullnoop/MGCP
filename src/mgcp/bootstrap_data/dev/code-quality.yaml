lessons:
  - id: code-quality
    trigger: "When writing, reviewing, or refactoring code — ensuring readability, maintainability, and adherence to clean code principles"
    action: "Write code that reads like well-structured prose. Use meaningful names, keep functions focused, annotate types, and let the code explain 'what' while comments explain 'why'."
    rationale: "Code is read 10x more than it is written. Every shortcut in clarity compounds into hours of confusion for future readers — including your future self. Maintainable code is the highest-leverage investment a team can make."
    tags: [meta, code-quality, maintainability]

  - id: meaningful-names
    trigger: "When naming variables, functions, classes, or modules — choosing names that reveal intent and make code self-explanatory"
    action: "Choose names that reveal intent. Variables should describe what they hold, functions should describe what they do, classes should describe what they represent. Avoid abbreviations, single-letter names (except loop counters), and generic names like 'data', 'info', 'temp'."
    rationale: "A name is a micro-documentation. 'elapsed_time_in_days' tells you everything; 'd' tells you nothing. Good names eliminate the need for comments and reduce cognitive load when scanning code."
    parent_id: code-quality
    tags: [code-quality, naming, readability]
    examples:
      - label: bad
        code: |
          def calc(d, r):
              return d * r / 365
        explanation: "Unclear what d, r, or 365 represent — requires reading the caller to understand"
      - label: good
        code: |
          def calculate_daily_interest(principal: float, annual_rate: float) -> float:
              DAYS_PER_YEAR = 365
              return principal * annual_rate / DAYS_PER_YEAR
        explanation: "Names reveal intent, magic number is a named constant, types are annotated"

  - id: function-design
    trigger: "When designing or refactoring functions — keeping them short, focused on a single responsibility, and limiting parameters"
    action: "Keep functions under 20 lines. Each function should do exactly one thing. Limit parameters to 0-3; if you need more, group them into an object or dataclass. Extract nested logic into well-named helper functions."
    rationale: "Long functions with many parameters are hard to test, hard to name, and hard to reuse. A function that does one thing can be understood in seconds, tested in one assertion, and composed freely with other functions."
    parent_id: code-quality
    tags: [code-quality, functions, design]
    examples:
      - label: bad
        code: |
          def process_order(user_id, product_id, quantity, discount_code,
                            shipping_addr, billing_addr, payment_method,
                            gift_wrap, note):
              # 80 lines of mixed validation, calculation, and persistence
              ...
        explanation: "Too many parameters, too many responsibilities, impossible to test in isolation"
      - label: good
        code: |
          def process_order(order: Order) -> OrderResult:
              validated = validate_order(order)
              total = calculate_total(validated)
              return submit_payment(validated, total)
        explanation: "Parameters grouped into a dataclass, each step is a focused function"

  - id: code-review-standards
    trigger: "When submitting or reviewing pull requests — following best practices for PR size, review turnaround, and review focus areas"
    action: "Keep PRs under 400 lines of changed code. Review within 24 hours. Focus reviews on: security implications, edge cases, error handling, and naming clarity — not style preferences covered by linters."
    rationale: "PRs over 400 lines get rubber-stamped — reviewers cannot maintain attention across thousands of lines. Fast turnaround keeps developers unblocked. Focusing on substance over style makes reviews valuable instead of adversarial."
    parent_id: code-quality
    tags: [code-quality, code-review, process]
    examples:
      - label: bad
        code: |
          # PR: "Refactor everything" — 2,400 lines changed across 47 files
          # Review comment: "Looks good to me" (after 3 minutes)
        explanation: "Too large to review meaningfully, approved without real scrutiny"
      - label: good
        code: |
          # PR: "Add input validation to /api/users endpoint" — 180 lines
          # Review comments focus on:
          #   - "What happens if email contains unicode?"
          #   - "Should we rate-limit this endpoint?"
          #   - "Missing test for empty payload"
        explanation: "Small PR, substantive review comments on security and edge cases"

  - id: documentation-strategy
    trigger: "When deciding what to document — balancing between too much documentation that rots and too little that leaves teammates guessing"
    action: "Document these and nothing else: (1) public API contracts with parameter types and return values, (2) architectural decisions via ADRs, (3) setup/onboarding instructions, (4) non-obvious 'why' explanations. Let tests document behavior and types document interfaces."
    rationale: "Documentation that restates code rots instantly and misleads. Documentation that captures decisions and context remains valuable for years. Focus documentation effort where it has the highest shelf life."
    parent_id: code-quality
    tags: [code-quality, documentation, process]

  - id: type-annotations
    trigger: "When writing code in dynamically typed languages like Python or TypeScript — adding type hints for function signatures, return values, and complex data structures"
    action: "Add type annotations to all function signatures and return values. Use typed containers (list[str], dict[str, int]) instead of bare list/dict. Use dataclasses or TypedDict for complex structures. Run a type checker (mypy, pyright) in CI."
    rationale: "Type annotations catch entire categories of bugs before runtime — wrong argument order, None where a value is expected, incorrect return types. They also serve as machine-verifiable documentation that never goes stale."
    parent_id: code-quality
    tags: [code-quality, types, safety]
    examples:
      - label: bad
        code: |
          def get_users(ids, active=True):
              results = []
              for id in ids:
                  u = db.find(id)
                  if u and (not active or u.active):
                      results.append(u)
              return results
        explanation: "No indication what 'ids' is (list? set? generator?), what db.find returns, or what get_users returns"
      - label: good
        code: |
          def get_users(ids: list[int], active: bool = True) -> list[User]:
              results: list[User] = []
              for user_id in ids:
                  user: User | None = db.find(user_id)
                  if user and (not active or user.active):
                      results.append(user)
              return results
        explanation: "Types make the contract explicit — callers know exactly what to pass and what they get back"

  - id: dependency-minimization
    trigger: "When you implement a feature and reach for a new dependency or library. Also when git commit stages pyproject.toml, requirements.txt or a lockfile."
    action: "Before adding a dependency, ask: (1) Can I implement this in <50 lines? (2) Is this actively maintained (commits in last 6 months)? (3) How many transitive dependencies does it pull in? (4) What is the project's security track record? Prefer standard library solutions and small, focused packages over large frameworks. Record the choice before you commit. The commit gate asks for a catalogue decision when pyproject.toml is staged. Call add_catalogue_item(item_type='decision') and name the alternative you rejected. When you remove the last import of a package, remove the package in the same commit."
    rationale: "Every dependency is a liability. It can introduce vulnerabilities through the supply chain, break on upgrade, become abandoned, or conflict with other packages. The cost runs past installation into perpetual maintenance, security monitoring and upgrade coordination. MGCP carried websockets, playwright and aiohttp in pyproject.toml with no import in src or tests. websockets served one route that no client ever connected to. The screenshots the other two would have produced are committed images with no generator. One import sweep found all three."
    parent_id: code-quality
    tags: [code-quality, dependencies, security]

  - id: avoid-premature-abstraction
    trigger: "When you implement a feature, refactor, or add a helper. Also when git commit stages a new flag, config key, parameter or base class. Covers an abstraction added before several concrete use cases exist."
    action: "Wait for three concrete instances before abstracting. Duplicate code costs less than the wrong abstraction. Extract an abstraction from working code, and never design one in advance. Prefer composition over inheritance. Apply the one-caller test before every commit: grep for callers of a new flag, config key or base class. One caller, or one subclass, means the generality is speculative. Delete it and inline the behaviour."
    rationale: "Premature abstraction creates rigid code that serves imagined needs instead of real ones. Three similar lines read easier than one wrong abstraction that everything depends on. MGCP shipped a REM operation, action_effectiveness, that measured whether past remediations helped. It read rows from a table that nothing in production ever wrote. The live table held 0 rows. A model, a table, two indexes and nine functions existed to feed it. Each had one production caller, and it was that operation. Deleting the operation removed 289 lines of source and 147 lines of tests."
    parent_id: code-quality
    tags: [code-quality, abstraction, design]
    examples:
      - label: bad
        code: |
          # First use case: send email
          class AbstractNotificationStrategy(ABC):
              @abstractmethod
              def format(self): ...
              @abstractmethod
              def send(self): ...
              @abstractmethod
              def retry(self): ...

          class EmailStrategy(AbstractNotificationStrategy):
              ...  # 50 lines to implement the interface
        explanation: "Abstracted on the first use case. The interface is now shaped by email and fits SMS or Slack badly"
      - label: good
        code: |
          # First use case: send the email and nothing more
          def send_email(to: str, subject: str, body: str) -> None:
              smtp.send(to, subject, body)

          # Second use case: send the SMS and nothing more
          def send_sms(to: str, message: str) -> None:
              twilio.send(to, message)

          # Third use case: NOW abstract, informed by real patterns
        explanation: "Concrete implementations first. Abstract later, once you know what they have in common"

  - id: self-documenting-code
    trigger: "When writing comments or deciding whether code needs explanation — using comments for 'why' and letting code express 'what'"
    action: "Write code that explains itself through clear naming, small functions, and explicit types. Reserve comments for: (1) explaining WHY a non-obvious approach was chosen, (2) linking to external references (RFCs, issue trackers), (3) warning about consequences. Delete comments that restate what the code does."
    rationale: "Comments that say 'what' become lies when code changes but comments do not. Comments that say 'why' remain true regardless of refactoring. The best comment is a well-named function that makes the comment unnecessary."
    parent_id: code-quality
    tags: [code-quality, comments, readability]
    examples:
      - label: bad
        code: |
          # Increment counter by one
          counter += 1

          # Check if user is admin
          if user.role == 'admin':
              ...
        explanation: "Comments restate what the code already says — they add noise and will rot"
      - label: good
        code: |
          # Compensate for off-by-one in legacy billing API (see JIRA-4521)
          counter += 1

          # Admin bypass required by SOC2 audit requirement §4.3
          if user.role == 'admin':
              ...
        explanation: "Comments explain WHY — the non-obvious reasoning that code alone cannot convey"

  - id: no-swallowed-errors
    trigger: "When you implement or refactor error handling, or add a helper that catches exceptions. Also when git commit stages a new broad except clause in Python."
    action: "Handle the error or re-raise it. The complexity gate refuses a new `except Exception:` or bare `except:` whose body is only pass, continue, or a return of a constant. To satisfy the gate, log the error with its context, re-raise it, or return a value that tells the caller the work did not happen. When the swallow is the design, write `# mgcp: allow-broad-except <reason>` on the except line. The hook's own fail-open handlers carry that comment, because enforcement must allow a tool call it cannot parse."
    rationale: "A swallowed error reports success. REM's duplicate scan could not open the embedded vector store, because a local Qdrant allows one client per path. Its handler returned an empty list. An empty finding list renders as 'Knowledge base looks healthy', so every cycle reported a clean corpus from a scan that never ran. The audit found this by reading the handler. No failure was ever visible to read."
    parent_id: code-quality
    tags: [code-quality, errors, exceptions, enforcement]
    examples:
      - label: bad
        code: |
          try:
              pairs = await find_duplicates(threshold=0.85, store=self.store)
          except Exception:
              return []
        explanation: "The caller cannot tell a clean scan from a scan that never ran"
      - label: good
        code: |
          try:
              pairs = await find_duplicates(threshold=0.85, store=self.store)
          except Exception as e:
              logger.warning(f'Duplicate detection failed: {e}')
              return [RemFinding(
                  operation='duplicate_detection',
                  title='Duplicate scan could not run',
                  description=f'find_duplicates raised: {e}',
                  metadata={'error': str(e)},
              )]
        explanation: "The failure reaches the caller as data, and the report says the corpus is unverified"

  - id: no-pass-through-wrappers
    trigger: "When you add a helper, extract a function during a refactor, or implement a convenience method. Also when git commit stages a new one-line function."
    action: "Call the target directly. The complexity gate refuses a new function whose body is one return of a call that forwards its own parameters unchanged. Give a wrapper work of its own before you keep it: a default, a type conversion, a guard, or a narrower contract. When the only gain is a shorter name, rename the target instead. When you want the call site to read better, name the variable, not a new function."
    rationale: "graph.py shipped get_prerequisites, get_next_in_sequence and get_alternatives from v1.0.0. Each body was one return of get_by_relationship_type with the same lesson_id. The audit found get_next_in_sequence had no caller at all. The other two had test callers and no production caller. Those two tests now call get_by_relationship_type directly. A later sweep deleted get_by_relationship_type for the same reason. A pass-through adds a name, a test and a stack frame, and changes no behaviour. It also hides the real call site from grep, so the next reader follows two hops to learn nothing."
    parent_id: code-quality
    tags: [code-quality, functions, design, enforcement]
    examples:
      - label: bad
        code: |
          def get_prerequisites(self, lesson_id: str) -> list[str]:
              """Get prerequisite lessons (must know/do first)."""
              return self.get_by_relationship_type(lesson_id, 'prerequisite')
        explanation: "Forwards its only parameter and adds nothing. Callers can pass the literal themselves"
      - label: good
        code: |
          # The call site reads well enough without a second name.
          prerequisites = graph.get_by_relationship_type(lesson_id, 'prerequisite')

          # A wrapper earns its place when it does work of its own.
          def get_lesson_or_raise(self, lesson_id: str) -> Lesson:
              lesson = self.get_lesson(lesson_id)
              if lesson is None:
                  raise KeyError(f'no lesson {lesson_id} in store {self.path}')
              return lesson
        explanation: "The direct call needs no helper. The kept helper adds a guard and an error message"

  - id: no-unrequested-compat-shims
    trigger: "When you implement a rename, a replacement field, or a second code path. Also when you refactor and keep the old name, or run git commit with a new alias or a deprecation comment."
    action: "Remove the old path in the same commit that adds the new one. Do not ship an alias, a deprecated wrapper or a dual code path that nobody asked for. Apply this test before you keep a shim: name the caller that needs it. When you cannot name one, delete the shim. Check who reads a field before you label it deprecated, and record the grep in the commit message."
    rationale: "MGCP carried related_ids beside relationships, and both held the same edges. link_lessons, bootstrap, the NetworkX builder and the web graph each had a branch labelled backwards compatibility. Every one of them wrote the edge twice. Two sources of truth disagree in the end. Of 124 live lessons carrying related_ids, every id was already in relationships, so the field went with no loss. The same sweep found parent_id labelled deprecated while four production paths read it, and 84 of 241 lessons carried one. Removing that field would have been a rewrite, and the label was what was wrong."
    parent_id: code-quality
    tags: [code-quality, design, maintainability]
    examples:
      - label: bad
        code: |
          def link_lessons(source: str, target: str, rel_type: str) -> None:
              _append_relationship(source, target, rel_type)
              # Backwards compatibility: keep related_ids in sync
              _append_related_id(source, target)
        explanation: "Two stores of the same edge. Nobody asked for the second one, and they drift"
      - label: good
        code: |
          def link_lessons(source: str, target: str, rel_type: str) -> None:
              _append_relationship(source, target, rel_type)

          # Migration reads the old column with raw SQL, once, and the model
          # no longer carries it. Checked first: all 124 rows round-trip.
        explanation: "One writer. The old data is carried across by a migration, not by a second live path"

  - id: one-implementation-per-behaviour
    trigger: "When you implement logic that exists elsewhere, refactor shared code, or add a helper beside a similar one. Also when git commit stages the same change in two files."
    action: "Keep one implementation of any behaviour. When a second copy appears, find which copy runs in production and delete the other. Apply this test: when a bug fix needs the same edit in two places, those places are one behaviour. Test the copy that decides, not the copy that imports cleanly. When two callers need the same code, give them one module to import."
    rationale: "enforcement.py held a second copy of the PreToolUse evaluator. The hook keeps its own copy, because it must be stdlib-only with no mgcp import. Nothing in production called the package copy. tests/test_enforcement.py was its only importer. The documented shared contract was two suites over two implementations. One of those implementations never decided a tool call. Deleting it took enforcement.py from 573 lines to 260. The copy also hid a real gap. The live MGCP_BYPASS regex in user-prompt-dispatcher.py had no test, because the only tests of that logic drove the dead copy. Six tests were added against the live parse."
    parent_id: code-quality
    tags: [code-quality, duplicates, maintainability]
    examples:
      - label: bad
        code: |
          # src/mgcp/enforcement.py: evaluate_rules, trigger_matches, ...
          # hook_templates/pre-tool-dispatcher.py: the same logic again
          # Only the hook ever refuses a tool call. The tests drove the other one.
        explanation: "Two implementations, two suites, and the tested one decides nothing"
      - label: good
        code: |
          # hook_templates/quality_metrics.py holds the metric code once.
          # The hook imports it from its own directory.
          # CI runs the same file as a script:
          #   python src/mgcp/hook_templates/quality_metrics.py --base origin/main
        explanation: "One module, two callers. A commit that bypassed the gate locally still fails CI"

  - id: edit-before-adding-a-module
    trigger: "When you implement a feature and reach for a new file, or refactor by moving code into a new module. Also when git commit stages a new .py file under src."
    action: "Edit an existing module first. Apply this test before you add a file: name the module you would have edited, and say why the code does not belong there. When the answer is that the file is already too long, split that file instead. The commit gate asks for a catalogue decision when a new module is staged. Record one with add_catalogue_item(item_type='decision') and name the alternative you rejected."
    rationale: "MGCP shipped migrations.py beside the repairs that persistence.py already runs on every store open. The two drifted, and the new file held the copy nobody ran. It went out with its tests in the audit that removed about 1,600 lines. A new file also costs an import, a test file and one more place for the next reader to look. The catalogue decision is what search_catalogue returns to the next session before it changes the same code. The commit message stays with git blame, and the decision stays with retrieval."
    parent_id: code-quality
    tags: [code-quality, architecture, maintainability]
    examples:
      - label: bad
        code: |
          # New file: src/mgcp/migrations.py
          # persistence.py already repairs the schema on every store open.
          # Two schema-repair paths now exist, and only one of them runs.
        explanation: "The new module duplicates a live path, then drifts from it unnoticed"
      - label: good
        code: |
          # Edit persistence.py: add the repair beside the ones that already run.
          # Then record why, so the next session finds it:
          add_catalogue_item(
              item_type='decision',
              title='Schema repairs stay in persistence.py',
              content='Rejected a migrations module: a second path that nothing runs.',
          )
        explanation: "One repair path, and the rejected alternative is on the record"

  - id: delete-dead-code-on-sight
    trigger: "When you implement around code you do not recognise, refactor a module, or read a function with no obvious caller. Also before git commit, for anything your change made unreachable."
    action: "Grep for callers before you keep a function or a branch. Zero callers means delete, together with the machinery that exists only to feed it. A test that asserts a file exists is not a reader. Trust a grep sweep, and not a deprecation label. Read the advisory vulture report in CI rather than waiting for a job to fail. When you keep something that looks dead, write the reason and the caller in a comment."
    rationale: "A scan of all 410 definitions in src/mgcp found one unreferenced name, and much more behind it. The web server carried a /ws/events route, a ConnectionManager and a task that polled the telemetry database every 500 milliseconds. No client ever connected. The task woke twice a second for the life of every dashboard process. Two documents said the feature worked. The claim test passed, because it checks that a documented endpoint resolves to a route, not that anything uses it. Six archived hook scripts went the same way. One test asserted that three of them existed, and it was their only reader. The archive answered the test, and the test guarded the archive. That removal was 97 insertions against 788 deletions."
    parent_id: code-quality
    tags: [code-quality, maintenance, dead-code]
    examples:
      - label: bad
        code: |
          @app.websocket('/ws/events')
          async def ws_events(websocket: WebSocket) -> None:
              await manager.connect(websocket)

          async def poll_telemetry() -> None:
              while True:
                  await manager.broadcast(read_recent_events())
                  await asyncio.sleep(0.5)
        explanation: "No client ever connected. The poll ran twice a second in every dashboard process"
      - label: good
        code: |
          # Deleted the route, ConnectionManager, the 500 ms poll task and the
          # three subscribe hooks in telemetry.py that fed only that route.
          # Kept scripts/clean_tool_call_envelopes.py, which looks unused:
          # models.py and server.py name it in operator-facing error messages.
        explanation: "The sweep deletes what has no reader and records the reader of what stays"
