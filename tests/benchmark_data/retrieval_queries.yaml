# Labelled retrieval query set for calibrating the lesson-search similarity floor.
#
# PROVENANCE: queries were authored against the real lesson corpus in ~/.mgcp
# (238 lessons, read-only snapshot taken 2026-07-28). Gold labels were written
# BEFORE any retrieval run; the pooled top-10 results of the min_score=0 sweep
# were then reviewed and additional genuinely-relevant lessons folded into
# `relevant` (standard TREC-style pooling). Nothing was removed from `relevant`
# to flatter a threshold.
#
# Schema
#   id          stable slug for the query
#   query       the text an agent would actually pass to query_lessons
#   paraphrase  same intent, different words. HELD-OUT set: the floor is chosen
#               on `query` and validated on `paraphrase`. Cosine scores move by
#               a median 0.045 under harmless rewording, so any floor tuned to a
#               gap narrower than that is fitted to phrasing, not to relevance.
#   gold        the lesson that SHOULD win at rank 1 (null for hard negatives)
#   relevant    every lesson a human would accept as genuinely useful here.
#               gold is always a member. Empty for hard negatives.
#   kind        positive | negative_out_of_domain | negative_near_domain
#
# Hard negatives are load-bearing: a floor that never returns empty is not a
# floor. negative_near_domain entries are in the software-engineering domain but
# have no lesson in the corpus (verified by keyword scan of all 238 bodies).

queries:
  # ---------------------------------------------------------------- positives
  - id: diff-size-discipline
    query: "I keep adding new helper modules and the diff is getting huge. how much should I be adding versus deleting?"
    paraphrase: "my change keeps growing with extra helper files, should I be cutting instead"
    gold: reduction-over-addition
    relevant: [reduction-over-addition]
    kind: positive

  - id: when-to-stop-reviewing
